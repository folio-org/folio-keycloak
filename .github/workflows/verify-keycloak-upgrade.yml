name: Verify Keycloak Upgrade Candidate

run-name: Verify Keycloak upgrade candidate on ${{ github.ref_name }}

on:
  workflow_dispatch:

concurrency:
  # Keep only one folio-keycloak verification active because the target workflow
  # also allows only one workflow_dispatch run on its default branch.
  group: verify-keycloak-upgrade
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  statuses: write

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  IMAGE_REPOSITORY: folioci/folio-keycloak
  TARGET_REPOSITORY: folio-org/applications-poc-tools
  TARGET_WORKFLOW: verify-dependent-modules.yml
  TARGET_BRANCH: master
  VERIFICATION_STATUS: keycloak-upgrade-verification

jobs:
  build-and-verify:
    name: Build candidate and verify dependent modules
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Find the pull request for this branch
        id: pull-request
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              state: 'open',
            });

            if (pulls.length === 0) {
              core.setFailed(
                `No open pull request found for branch ${branch}. Run this workflow ` +
                'from the branch of the upgrade pull request.'
              );
              return;
            }

            core.info(`Verifying pull request #${pulls[0].number} at ${context.sha}`);
            core.setOutput('number', String(pulls[0].number));
            core.setOutput('sha', context.sha);

      - name: Checkout upgrade branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate image inputs
        run: |
          readarray -t standard_keycloak_versions < <(
            sed -nE 's|^FROM quay\.io/keycloak/keycloak:([^ ]+).*|\1|p' Dockerfile | sort -u
          )
          readarray -t fips_keycloak_versions < <(
            sed -nE 's|^FROM quay\.io/keycloak/keycloak:([^ ]+).*|\1|p' Dockerfile-fips | sort -u
          )

          if (( ${#standard_keycloak_versions[@]} != 1 )); then
            echo 'Dockerfile must use exactly one Keycloak version.' >&2
            exit 1
          fi
          if (( ${#fips_keycloak_versions[@]} != 1 )); then
            echo 'Dockerfile-fips must use exactly one Keycloak version.' >&2
            exit 1
          fi
          if [[ "${standard_keycloak_versions[0]}" != "${fips_keycloak_versions[0]}" ]]; then
            echo 'Dockerfile and Dockerfile-fips use different Keycloak versions.' >&2
            exit 1
          fi

          standard_plugin_version=$(sed -nE \
            's/^ARG FOLIO_KEYCLOAK_PLUGIN_VERSION=([^ ]+)$/\1/p' Dockerfile)
          fips_plugin_version=$(sed -nE \
            's/^ARG FOLIO_KEYCLOAK_PLUGIN_VERSION=([^ ]+)$/\1/p' Dockerfile-fips)

          if [[ -z "$standard_plugin_version" || -z "$fips_plugin_version" ]]; then
            echo 'Both Dockerfiles must define FOLIO_KEYCLOAK_PLUGIN_VERSION.' >&2
            exit 1
          fi
          if [[ "$standard_plugin_version" != "$fips_plugin_version" ]]; then
            echo 'Dockerfile and Dockerfile-fips use different plugin versions.' >&2
            exit 1
          fi

          {
            echo "Keycloak version: ${standard_keycloak_versions[0]}"
            echo "Plugin version: $standard_plugin_version"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Calculate candidate image name
        id: image
        env:
          PULL_REQUEST_NUMBER: ${{ steps.pull-request.outputs.number }}
          SOURCE_SHA: ${{ steps.pull-request.outputs.sha }}
        run: |
          latest_tag=$(git describe --tags --match 'v[0-9]*' --abbrev=0 "$(git rev-list --tags --max-count=1)")
          released_version=${latest_tag#v}
          IFS=. read -r major minor _patch <<< "$released_version"

          if [[ ! "$major" =~ ^[0-9]+$ || ! "$minor" =~ ^[0-9]+$ ]]; then
            echo "Unable to calculate a candidate version from release tag $latest_tag" >&2
            exit 1
          fi

          # pr<number>.<short sha> keeps the tag readable next to the CI snapshots and
          # makes it deterministic, so the tag itself records whether this pull request
          # commit was already built.
          candidate_version="${major}.$((minor + 1)).0-SNAPSHOT.pr${PULL_REQUEST_NUMBER}.${SOURCE_SHA:0:7}"
          image="${IMAGE_REPOSITORY}:${candidate_version}"

          tag_url="https://hub.docker.com/v2/repositories/${IMAGE_REPOSITORY}/tags/${candidate_version}"
          response_file=$(mktemp)
          if ! status_code=$(curl --silent --show-error --location \
            --retry 3 --retry-all-errors \
            --output "$response_file" --write-out '%{http_code}' "$tag_url"); then
            echo 'Unable to check the candidate tag on Docker Hub.' >&2
            exit 1
          fi

          digest=''
          case "$status_code" in
            404)
              reused=false
              echo "Building a new candidate image: $image"
              ;;
            200)
              digest=$(jq --raw-output '.digest // empty' "$response_file")
              if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo 'Docker Hub reported no digest for the existing candidate tag.' >&2
                exit 1
              fi
              reused=true
              echo "Reusing the candidate image already built for this commit: $image"
              ;;
            *)
              echo "Docker Hub returned HTTP $status_code while checking the candidate tag." >&2
              exit 1
              ;;
          esac

          {
            echo "version=$candidate_version"
            echo "tag=$candidate_version"
            echo "reference=$image"
            echo "reused=$reused"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
          echo "Candidate image: $image" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        if: steps.image.outputs.reused != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.image.outputs.reused != 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build FIPS image
        id: fips
        if: steps.image.outputs.reused != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-fips
          platforms: linux/amd64
          push: false

      - name: Build and push candidate image
        id: build
        if: steps.image.outputs.reused != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.reference }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.pull-request.outputs.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}

      - name: Resolve immutable candidate reference
        id: candidate
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          REUSED_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          digest=${BUILD_DIGEST:-$REUSED_DIGEST}
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Candidate image digest is missing or invalid.' >&2
            exit 1
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "immutable=${IMAGE_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Immutable candidate: ${IMAGE_REPOSITORY}@${digest}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create bot token for dependent-module verification
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: folio-org
          repositories: applications-poc-tools

      - name: Verify dependent modules
        id: dependent-modules
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.immutable }}
        run: |
          dispatch_id="folio-keycloak-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          gh workflow run "$TARGET_WORKFLOW" \
            --repo "$TARGET_REPOSITORY" \
            --ref "$TARGET_BRANCH" \
            --field "keycloak-image=$CANDIDATE_IMAGE" \
            --field "dispatch_id=$dispatch_id"

          run_id=''
          for _attempt in {1..60}; do
            run_id=$(gh run list \
              --repo "$TARGET_REPOSITORY" \
              --workflow "$TARGET_WORKFLOW" \
              --branch "$TARGET_BRANCH" \
              --event workflow_dispatch \
              --limit 100 \
              --json databaseId,displayTitle \
              --jq "map(select(.displayTitle | contains(\"$dispatch_id\")))[0].databaseId // empty")

            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$run_id" ]]; then
            echo 'failure_reason=not-found' >> "$GITHUB_OUTPUT"
            echo 'The dependent-module workflow was dispatched but its run was not found.' >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "dispatch_id=$dispatch_id" >> "$GITHUB_OUTPUT"
          echo "Dependent-module run: https://github.com/${TARGET_REPOSITORY}/actions/runs/${run_id}" \
            >> "$GITHUB_STEP_SUMMARY"

          conclusion=''
          for attempt in {1..180}; do
            run_state=$(gh run view "$run_id" \
              --repo "$TARGET_REPOSITORY" \
              --json status,conclusion,url)
            run_status=$(jq --raw-output '.status' <<< "$run_state")

            if [[ "$run_status" == 'completed' ]]; then
              conclusion=$(jq --raw-output '.conclusion' <<< "$run_state")
              break
            fi
            if (( attempt % 20 == 0 )); then
              echo "Dependent-module run is still $run_status."
            fi
            sleep 15
          done

          if [[ -z "$conclusion" ]]; then
            echo 'failure_reason=timeout' >> "$GITHUB_OUTPUT"
            echo 'Timed out waiting 45 minutes for dependent-module verification.' >&2
            exit 1
          fi
          if [[ "$conclusion" != 'success' ]]; then
            echo 'failure_reason=modules' >> "$GITHUB_OUTPUT"
            echo "Dependent-module verification finished with conclusion: $conclusion" >&2
            exit 1
          fi

      - name: Report verification result to upgrade pull request
        if: always()
        uses: actions/github-script@v8
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
          CANDIDATE_TAG: ${{ steps.image.outputs.reference }}
          DEPENDENT_FAILURE_REASON: ${{ steps.dependent-modules.outputs.failure_reason }}
          DEPENDENT_OUTCOME: ${{ steps.dependent-modules.outcome }}
          DEPENDENT_RUN_ID: ${{ steps.dependent-modules.outputs.run_id }}
          FIPS_OUTCOME: ${{ steps.fips.outcome }}
          PULL_REQUEST_NUMBER: ${{ steps.pull-request.outputs.number }}
          SOURCE_SHA: ${{ steps.pull-request.outputs.sha }}
        with:
          script: |
            const marker = '<!-- keycloak-upgrade-verification -->';
            const attemptMarker = '<!-- keycloak-upgrade-verification-attempt -->';
            const pullNumber = Number.parseInt(process.env.PULL_REQUEST_NUMBER, 10);
            if (!Number.isInteger(pullNumber)) {
              core.info('The pull request was not validated, so no PR comment can be posted.');
              return;
            }

            const { owner, repo } = context.repo;
            const sourceSha = process.env.SOURCE_SHA || '';
            const digest = process.env.CANDIDATE_DIGEST || '';
            const hasDigest = /^sha256:[0-9a-f]{64}$/.test(digest);
            const outcome = process.env.DEPENDENT_OUTCOME || 'skipped';
            const failureReason = process.env.DEPENDENT_FAILURE_REASON || '';
            const runId = process.env.DEPENDENT_RUN_ID;
            const targetRepository = process.env.TARGET_REPOSITORY;
            const workflowRunUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const dependentRunLink = runId
              ? `[${targetRepository} · Verify Dependent Modules]` +
                `(${context.serverUrl}/${targetRepository}/actions/runs/${runId})`
              : null;
            const verificationSucceeded = hasDigest && outcome === 'success';
            const DEPLOY_GUIDE_URL = 'https://folio-org.atlassian.net/wiki/spaces/FOLIJET/pages/' +
              '1351254113/How+to+deploy+and+test+folio-kong+and+folio-keycloak+from+branch';

            // Read the existing comment first: on a failed run its verified commit is carried over,
            // so the merge gate keeps the anchor it needs for documentation-only commits.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );
            // `source-sha` is the marker name used before this workflow reported in one comment.
            const previousVerifiedSha = existing?.body
              ?.match(/<!-- (?:verified|source)-sha:([0-9a-f]{40}) -->/)?.[1];
            const verifiedSha = verificationSucceeded ? sourceSha : previousVerifiedSha;

            // Name the stage that actually failed. The dependent-module step also fails when the
            // run cannot be dispatched or found, and when the 45-minute wait runs out.
            let overall;
            let dependentModules;
            if (verificationSucceeded) {
              overall = '✅ Verified';
              dependentModules = `✅ passed — ${dependentRunLink}`;
            } else if (!hasDigest && process.env.FIPS_OUTCOME === 'failure') {
              overall = '❌ FIPS image build failed';
              dependentModules = '⏭ not started';
            } else if (!hasDigest) {
              overall = '❌ Candidate image build failed';
              dependentModules = '⏭ not started';
            } else if (outcome === 'skipped') {
              overall = '❌ Verification did not run';
              dependentModules = '⏭ not started';
            } else if (failureReason === 'timeout') {
              overall = '❌ Timed out waiting for dependent modules';
              dependentModules = `⏳ still running — ${dependentRunLink}`;
            } else if (!runId || failureReason === 'not-found') {
              overall = '❌ Could not start dependent-module run';
              dependentModules = '⏭ not started';
            } else {
              overall = '❌ Dependent modules failed';
              dependentModules = `❌ ${outcome} — ${dependentRunLink}`;
            }

            const body = [
              marker,
              ...(verifiedSha ? [`<!-- verified-sha:${verifiedSha} -->`] : []),
              '## Keycloak Upgrade Candidate',
              '',
              '| Check | Result |',
              '| --- | --- |',
              `| Overall | ${overall} |`,
              `| Commit | \`${sourceSha ? sourceSha.slice(0, 12) : 'unknown'}\` |`,
              `| Tag | ${hasDigest ? `\`${process.env.CANDIDATE_TAG}\`` : 'not published'} |`,
              `| Dependent modules | ${dependentModules} |`,
              ...(verificationSucceeded
                ? [
                    '',
                    'Deploy this image to a test environment for manual validation, not ' +
                      `\`latest\`. ([How to deploy from branch](${DEPLOY_GUIDE_URL}))`,
                  ]
                : []),
              '',
              `[Candidate build](${workflowRunUrl})`,
            ].join('\n');

            await core.summary.addRaw(body.replace(/^<!--.*-->\n/gm, '')).write();

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body,
              });
            }

            // Remove the separate attempt comment left by the earlier two-comment report.
            const attempt = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(attemptMarker)
            );
            if (attempt) {
              try {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: attempt.id });
              } catch (error) {
                core.warning(
                  `Could not delete the obsolete attempt comment ${attempt.id}: ${error.message}. ` +
                  'Delete it manually once; this pull request now shows two comments.'
                );
              }
            }

            if (!sourceSha) {
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: sourceSha,
              state: verificationSucceeded ? 'success' : 'failure',
              context: process.env.VERIFICATION_STATUS,
              description: verificationSucceeded
                ? 'Candidate image and dependent modules verified'
                : 'Candidate verification did not complete successfully',
              target_url: workflowRunUrl,
            });

      - name: Fail when dependent-module verification failed
        if: always() && steps.dependent-modules.outcome != 'success'
        run: |
          echo 'Dependent-module verification did not complete successfully.' >&2
          exit 1
