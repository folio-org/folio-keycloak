name: Keycloak Upgrade Instructions

on:
  # This workflow only reads PR metadata; it never checks out or executes PR code.
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - 'Dockerfile'
      - 'Dockerfile-fips'

jobs:
  add-runbook-comment:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Check if PR updates Keycloak
        id: check-keycloak
        uses: actions/github-script@v8
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const keycloakUpdate = files.some((file) => {
              if (!['Dockerfile', 'Dockerfile-fips'].includes(file.filename) || !file.patch) {
                return false;
              }

              return file.patch
                .split('\n')
                .some((line) =>
                  /^[+-]/.test(line) &&
                  (line.includes('KEYCLOAK_VERSION') ||
                    /quay\.io\/keycloak\/keycloak:\S+/.test(line))
                );
            });

            core.setOutput('is_keycloak_update', String(keycloakUpdate));

      - name: Create runbook comment if missing
        if: steps.check-keycloak.outputs.is_keycloak_update == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- keycloak-upgrade-runbook -->';
            const { owner, repo } = context.repo;
            const repositoryUrl = `${context.serverUrl}/${owner}/${repo}`;
            const workflowUrl = `${repositoryUrl}/actions/workflows/verify-keycloak-upgrade.yml`;
            const branch = context.payload.pull_request.head.ref;
            const body = [
              marker,
              '## Keycloak Upgrade Runbook',
              '',
              ':warning: **This PR updates the Keycloak base image and requires verification before merge.**',
              '',
              '### Pre-merge checklist',
              '',
              '- [ ] Review the [Keycloak upgrading guide](https://www.keycloak.org/docs/latest/upgrading/) and release notes.',
              '',
              '#### 1. Update and release folio-keycloak-plugins',
              '',
              '- [ ] `folio-keycloak-plugins` is released for the target Keycloak version, its JARs ' +
                'are in the FOLIO Maven registry, and both Dockerfiles use that ' +
                '`FOLIO_KEYCLOAK_PLUGIN_VERSION`.',
              '',
              '#### 2. Build and verify the candidate',
              '',
              '- [ ] Run the candidate verification and confirm that the **Keycloak Upgrade ' +
                'Candidate** comment on this pull request reports `✅ Verified`. The run takes ' +
                'about 20-45 minutes.',
              '  - How to start it: open the **Actions** tab, pick **Verify Keycloak Upgrade ' +
                `Candidate** in the left sidebar ([direct link](${workflowUrl})), press ` +
                '**Run workflow** on the right, then in **Use workflow from** type to filter and ' +
                `select \`${branch}\`, and press the green **Run workflow** button inside the ` +
                'dropdown. You need write access to this repository; if the **Run workflow** ' +
                'button is not shown, ask a maintainer to run it.',
              '  - A run that failed after the image was pushed can simply be repeated, because ' +
                'the same commit reuses the published image. A run that failed during the build ' +
                'repeats the build.',
              '  - The branch is missing from the list, or the workflow is missing from the ' +
                'sidebar? This branch is older than the workflow file. Comment ' +
                '`@dependabot recreate` on this pull request. `@dependabot rebase` is refused ' +
                'once a pull request carries manual commits, which it does after step 1. ' +
                '`recreate` discards manual edits, so redo the plugin version commit afterwards.',
              '- [ ] Check whether a newer `keycloak-admin-client` release exists for this Keycloak ' +
                'major version and update `applications-poc-tools` if so. ' +
                '([Maven Central](https://mvnrepository.com/artifact/org.keycloak/keycloak-admin-client))',
              '',
              '#### 3. Test the environment manually',
              '',
              '- [ ] Deploy the candidate image from the **Keycloak Upgrade Candidate** comment ' +
                '(never `latest`) to the test environment and confirm it works.',
              '',
              '#### 4. Prepare release documentation',
              '',
              '- [ ] Confirm whether `README.md` compatibility information needs an update, and ' +
                'update it if so.',
              '- [ ] Update `NEWS.md` with the Keycloak and plugin versions and relevant changes.',
              '',
              '#### 5. Final approval',
              '',
              '- [ ] Add `keycloak-verified` only after every preceding step is complete.',
              '',
              `See [\`docs/keycloak-upgrade.md\`](${repositoryUrl}/blob/master/docs/keycloak-upgrade.md) ` +
                'for the full process.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );

            if (existing) {
              core.info(`Runbook comment ${existing.id} already exists; keeping checklist progress.`);
              core.info(`Current runbook text:\n${body}`);
              return;
            }

            const legacy = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes('## Keycloak Upgrade Runbook')
            );
            if (legacy) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: legacy.id,
                body,
              });
              core.info(`Migrated legacy runbook comment ${legacy.id}.`);
              return;
            }

            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            core.info(`Created runbook comment ${comment.id}.`);
